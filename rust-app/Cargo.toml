[package]
name = "xnode-manager"
version = "2.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-cors = "0.7"
actix-web = "4"
async-recursion = "1.1"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
nvml-wrapper = "0.12"
posix-acl = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
tokio = { version = "1", features = ["fs", "process"] }
